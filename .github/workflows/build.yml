name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patch \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            openjdk-17-jdk

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Bootstrap Buildozer SDK & Cmdline Tools
        run: |
          # 1. Ensure Buildozer SDK directory structure exists
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # 2. Copy cmdline-tools from GitHub runner system SDK
          cp -r $ANDROID_HOME/cmdline-tools/latest/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          
          # 3. Create legacy symlink so p4a legacy checks pass
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          # 4. Accept all SDK licenses directly in Buildozer context
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AwesomeVHS-debug-apk
          path: bin/*.apk

