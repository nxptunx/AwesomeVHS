name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patch \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-accept Buildozer SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n2433370235063092619c5220758703070d289d92\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2433370235063092619c5220758703070d289d92" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9402116e2670a46da3ff7acb3a4eb023a7" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo -e "\nd9058fa0 fine" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
          echo -e "\n601007b94784f6376450d10805691178d0285230" > ~/.buildozer/android/platform/android-sdk/licenses/mips-android-sysimage-license

      - name: Build with Buildozer
        run: |
          buildozer android debug || true
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AwesomeVHS-debug-apk
          path: bin/*.apk
